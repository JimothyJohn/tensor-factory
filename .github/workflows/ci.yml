name: CI

# The local gate is ./Quickstart -c; this runs the same steps in CI so a green PR locally is
# a green PR here. Pull requests and pushes to master both run it.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync (locked)
        run: uv sync --locked --all-packages

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Unit tests
        run: uv run --all-packages python -m pytest -m unit

  # The Doom test: the pipeline must run on a bare CPython with no wheels installed.
  # The unit suite proves this with an import blocker; this job proves it with an
  # actually-empty environment -- no uv, no venv, no pip install of any kind.
  portability:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v4

      - name: Zero-dependency pipeline check
        run: python3 scripts/portability_check.py
