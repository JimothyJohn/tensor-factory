name: CI

# Mirrors the local gate (./Quickstart -c) so green-locally == green-in-CI:
# ruff lint + format, ty types, pytest unit, AND the Studio JS unit tests.
# Runs on PRs and on pushes to the long-lived branches (dev integration +
# master release); this `gate` job is the single required status check that
# branch protection on `dev` and Dependabot auto-merge gate on.
on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Node (Studio JS tests)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Sync (locked)
        run: uv sync --locked --all-packages

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Unit tests (Python)
        run: uv run --all-packages python -m pytest -m unit

      - name: Unit tests (Studio JS)
        run: node --test studio/tests/*.test.mjs

  # The gate job has no torch, so every training test is skipped there. This job installs
  # it and runs the training + Studio suites for real (tiny models, CPU, well under a
  # minute of test time). macOS because the arm64 torch wheel is ~130 MB; the Linux one
  # drags in the CUDA stack.
  train:
    runs-on: macos-latest
    env:
      # A hosted runner's virtualized GPU can report MPS available and then fail to
      # allocate; these are tiny models, so pin the CPU and keep the job deterministic.
      TENSOR_FACTORY_DEVICE: cpu
      # The runner's default python3 is whatever Homebrew shipped last, which can be newer
      # than the wheels in the lockfile (3.15 had no onnxruntime wheel). Pin one that does.
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync with torch (locked)
        run: uv sync --locked --all-packages --extra train --extra serve

      - name: Training + Studio tests
        run: >-
          uv run --all-packages --extra train --extra serve python -m pytest
          packages/tensor-factory-train packages/tensor-factory-studio
          -m "unit or integration"

  # The Doom test: the pipeline must run on a bare CPython with no wheels installed.
  # The unit suite proves this with an import blocker; this job proves it with an
  # actually-empty environment -- no uv, no venv, no pip install of any kind.
  portability:
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      - uses: actions/checkout@v7

      - name: Zero-dependency pipeline check
        run: python3 scripts/portability_check.py
